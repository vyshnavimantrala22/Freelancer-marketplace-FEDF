<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | FreelanceHub</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/auth.css"
    >
    <link
        rel="stylesheet"
        href="../css/admin.css"
    >
    
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-header">

                <p class="hero-tag">
                    ADMIN MODULE
                </p>

                <h1>
                    Admin Login
                </h1>

                <p>
                    Access the FreelanceHub administration panel.
                </p>

            </div>

            <form id="adminLoginForm">

                <div class="form-group">

                    <label for="adminEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Enter admin email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter admin password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Login as Admin
                </button>

                <p id="adminLoginMessage"></p>

            </form>

            <div class="auth-footer">

                <a href="../index.html">
                    ← Back to FreelanceHub
                </a>

            </div>

        </section>

    </main>

    <script src="../js/admin-login.js"></script>

</body>

</html>
