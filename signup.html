<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | FreelanceHub</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/auth.css">

</head>


<body>

    <!-- Navigation -->

    <header class="navbar">

        <div class="logo">
            FreelanceHub
        </div>

        <a href="index.html" class="btn btn-outline">
            ← Back to Home
        </a>

    </header>


    <!-- Signup -->

    <main class="auth-container">

        <div class="auth-card">

            <div class="auth-header">

                <p class="hero-tag">
                    JOIN FREELANCEHUB
                </p>

                <h1>
                    Create your account
                </h1>

                <p>
                    Start your freelancing journey today.
                </p>

            </div>


            <form id="signupForm">


                <div class="form-group">

                    <label for="signupName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="signupName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="signupEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="signupPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="signupRole">
                        Account Type
                    </label>

                    <select id="signupRole" required>

                        <option value="">
                            Select account type
                        </option>

                        <option value="client">
                            Client
                        </option>

                        <option value="freelancer">
                            Freelancer
                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary auth-button"
                >
                    Create Account
                </button>


                <p id="signupMessage" class="form-message"></p>


            </form>


            <div class="auth-footer">

                <p>
                    Already have an account?
                    <a href="login.html">
                        Login
                    </a>
                </p>

            </div>

        </div>

    </main>


    <script src="js/auth.js"></script>

</body>

</html>
